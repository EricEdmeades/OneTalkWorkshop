<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Feedback — The One Talk Workshop</title>
<meta name="description" content="Tell us how today went at The One Talk Workshop.">
<meta name="theme-color" content="#E26320">
<!-- Attendee-only page: never index it, and never let it show up in search. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="/assets/favicon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body class="page-survey">

<nav class="topnav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="/assets/speaker-nation-logo-black.png" alt="Speaker Nation" width="150" height="53">
    </a>
  </div>
</nav>

<section class="offer sect-pad">
  <div class="wrap">
    <div class="offer-inner">
      <span class="eyebrow">Your feedback</span>
      <h1>How was today?</h1>
      <p class="lead" style="max-width:560px; margin:0 auto 1.5rem;">Two minutes, and it shapes tomorrow. Every question is optional.</p>
    </div>

    <form class="survey-form" data-survey novalidate>
      <!-- Day is preselected from the date by src/survey.js; the buttons stay
           visible so an attendee filling it in late can correct it. -->
      <fieldset class="survey-q">
        <legend>Which day are you reviewing?</legend>
        <div class="survey-options" data-day-picker></div>
      </fieldset>

      <label class="survey-q survey-field">
        <span class="survey-label">The email you registered with</span>
        <span class="survey-help">Used only to join up your answers across the three days. It is stored scrambled, never shown in the report.</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <div data-questions></div>

      <label class="survey-check">
        <input type="checkbox" name="contactOptIn">
        <span>It's fine for Eric's team to contact me about this feedback. (Only then is your email stored as an address.)</span>
      </label>

      <!-- Honeypot: real people never see this, bots fill it in. -->
      <div class="lead-hp" aria-hidden="true">
        <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <button type="submit" class="btn-primary">Send my feedback</button>
      <p class="lead-error" role="alert" aria-live="polite" data-error></p>
    </form>
  </div>
</section>

<footer>
  <div class="foot-inner">
    <div class="foot-logo">
      <a href="https://speakernation.com">
        <img src="/assets/speaker-nation-logo-white.png" alt="Speaker Nation" width="1000" height="354" loading="lazy" decoding="async">
      </a>
    </div>
    <div class="foot-links">
      <a href="https://speakernation.com/privacy-policy/">Privacy Policy</a>
      <a href="https://speakernation.com/terms-and-conditions/">Terms &amp; Conditions</a>
      <a href="mailto:support@speakernation.com">Contact</a>
    </div>
    <div class="foot-copy">© 2026 Speaker Nation. All rights reserved.</div>
  </div>
</footer>

<script type="module" src="/src/survey.js"></script>
</body>
</html>
